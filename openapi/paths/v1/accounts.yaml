get:
  tags:
    - Account
  summary: "Get list of accounts"
  description: "Get list of accounts"
  operationId: "listAccounts"
  parameters:
    - name: pageNumber
      in: query
      required: false
      description: The page number to retrieve (0-based index).
      schema:
        type: integer
        default: 0
        examples:
          - 0
    - name: pageSize
      in: query
      required: false
      description: The number of items to return per page.
      schema:
        type: integer
        default: 25
        examples:
          - 25
    - name: orderBy
      in: query
      required: false
      description: The field to order the items by.
      schema:
        type: string
        default: id
        examples:
          - itemName
    - name: orderDirection
      in: query
      required: false
      description: The direction to order the items (asc or desc).
      schema:
        type: string
        enum: [asc, desc]
        default: asc
        examples:
          - asc
  responses:
    '200':
      description: "Success"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/accounts_response.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
post:
  tags:
    -  Account
  summary: Create a new Account
  description: Create a new Account
  operationId: createAccount
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/v1/account.yaml
  responses:
    '201':
      description: Created
      headers:
        Location:
          description: Resource location of new Account
          schema:
            type: string
            format: uri
            examples:
              - http://example.com/api/v1/accounts/1234
    '400':
      $ref: ../../components/responses/bad_request_400.yaml