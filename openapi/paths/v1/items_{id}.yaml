get:
  tags:
    - Item
  summary: "Get item by ID"
  description: "Get item by ID"
  operationId: "getItemById"
  parameters:
    - name: id
      in: path
      description: ID of the item
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: "Success"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/item.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
    '404':
      $ref: ../../components/responses/not_found_404.yaml
put:
  tags:
    -  Item
  summary: Update an Item by ID
  description:  |
    Allows to update an Item by its ID
  operationId: updateItem
  parameters:
    - name: id
      in: path
      description: The ID of the item to update
      required: true
      schema:
        type: integer
        format: int64
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/v1/item_request.yaml
  responses:
    '200':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/item.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
    '404':
      $ref: ../../components/responses/not_found_404.yaml
delete:
  tags:
    -  Item
  summary: Delete Item by ID
  description:  |
    Allows to delete an Item by its ID
  operationId: deleteItem
  parameters:
    - name: id
      in: path
      description: The ID of the item to delete
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: No Content
    '404':
      $ref: ../../components/responses/not_found_404.yaml
    '409':
      $ref: ../../components/responses/conflict_409.yaml