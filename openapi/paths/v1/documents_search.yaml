parameters:
  - $ref: ../../components/parameters/headers.yaml#/components/parameters/Accept-Language
  - $ref: ../../components/parameters/headers.yaml#/components/parameters/Transaction-Id
get:
  tags:
    - Document
  summary: Search for documents
  description: Search for documents using document-level criteria
  operationId: searchDocuments
  parameters:
    - name: documentDate
      in: query
      required: false
      description: Date of the documents to return
      schema:
        type: string
        format: date
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/pageNumber
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/pageSize
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/orderBy
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/orderDirection
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/v1/documents_response.yaml'
      headers:
        Transaction-Id:
          $ref: ../../components/headers/common.yaml#/components/headers/Transaction-Id      
    '400':
      $ref: '../../components/responses/bad_request_400.yaml'