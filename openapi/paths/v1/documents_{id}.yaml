parameters:
  - $ref: ../../components/parameters/headers.yaml#/components/parameters/Accept-Language
  - $ref: ../../components/parameters/headers.yaml#/components/parameters/Transaction-Id
  - name: id
    in: path
    description: ID of the document
    required: true
    schema:
      type: integer
      format: int64
get:
  tags:
    - Document
  summary: "Get document by ID"
  description: "Get document by ID"
  operationId: "getDocumentById"
  responses:
    '200':
      description: "Success"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/document_response.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
    '404':
      $ref: ../../components/responses/not_found_404.yaml
put:
  tags:
    -  Document
  summary: Update a Document by ID
  description:  |
    Allows to update a Document by its ID
  operationId: updateDocument
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/v1/document_request.yaml
  responses:
    '200':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/document_response.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
    '404':
      $ref: ../../components/responses/not_found_404.yaml
delete:
  tags:
    -  Document
  summary: Delete Document by ID
  description:  |
    Allows to delete a Document by its ID
  operationId: deleteDocument
  parameters:
    - name: id
      in: path
      description: The ID of the document to delete
      required: true
      schema:
        type: integer
        format: int64
  responses:
    '204':
      description: No Content
    '404':
      $ref: ../../components/responses/not_found_404.yaml