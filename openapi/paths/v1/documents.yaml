parameters:
  - name: Accept-Language
    in: header
    description: "The language you prefer for messages. Supported values are `en-AU, en-CA, en-GB, en-US`."
    required: false
    schema:
        type: string
        default: en-GB
        examples:
          - en-US
  - name: Transaction-Id
    in: header
    description: "Transaction-Id header parameter."
    required: true
    schema:
        type: string
        format: UUID
get:
  tags:
    - Document
  summary: "Get list of documents"
  description: "Get list of documents"
  operationId: "listDocuments"
  responses:
    '200':
      description: "Success"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/documents_response.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
post:
  tags:
    - Document
  summary: Create a new document
  description: "This operation creates a new financial document"
  operationId: createDocument
  requestBody:
    content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/document_request.yaml
    description: "Document request to be created."
    required: true
  responses:
    '201':
      description: "Created"
      headers:
        Location:
          description: Resource location of new document
          schema:
            type: string
            format: url
            examples:
              - http://example.com/v1/documents/1234
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
