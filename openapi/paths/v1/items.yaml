get:
  tags:
    - Item
  summary: "Get list of items"
  description: "Get paginated list of items"
  operationId: "listItems"
  parameters:
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/pageNumber
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/pageSize
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/orderBy
    - $ref: ../../components/parameters/pagination.yaml#/components/parameters/orderDirection
  responses:
    '200':
      description: "Success"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/items_response.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
post:
  tags:
    -  Item
  summary: Create a new Item
  description: Create a new Item
  operationId: createItem
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/v1/item_request.yaml
  responses:
    '201':
      description: Created
      headers:
        Location:
          description: Resource location of new Item
          schema:
            type: string
            format: uri
            examples:
              - http://example.com/api/v1/items/1234
    '400':
      $ref: ../../components/responses/bad_request_400.yaml