get:
  tags:
    - Category
  summary: "Get list of categories"
  description: "Get paginated list of categories"
  operationId: "listCategories"
  parameters:
  - $ref: ../../components/parameters/pagination.yaml#/components/parameters/pageNumber
  - $ref: ../../components/parameters/pagination.yaml#/components/parameters/pageSize
  - $ref: ../../components/parameters/pagination.yaml#/components/parameters/orderBy
  - $ref: ../../components/parameters/pagination.yaml#/components/parameters/orderDirection
  responses:
    '200':
      description: "Success"
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/v1/categories_response.yaml
    '400':
      $ref: ../../components/responses/bad_request_400.yaml
post:
  tags:
    -  Category
  summary: Create a new Category
  description: Create a new Category
  operationId: createCategory
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/v1/category_request.yaml
  responses:
    '201':
      description: Created
      headers:
        Location:
          description: Resource location of new Category
          schema:
            type: string
            format: uri
            examples:
              - http://example.com/api/v1/categories/1234
    '400':
      $ref: ../../components/responses/bad_request_400.yaml