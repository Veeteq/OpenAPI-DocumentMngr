type: object
description: >
  Request used to create or update a financial document.
  For Transfer documents, transfer-specific information must be provided
  in the transfer property, while documentItems and counterpartyId are
  not applicable.
required:
  - documentDate
  - documentType
  - accountId
  - payment
properties:
  documentDate:
    type: string
    format: date
    description: Date of the document
    examples:
      - "2023-10-01"
  documentType:
    $ref: document_type.yaml
  documentName:
    type: string
    description: Name of the document
    examples:
      - "October Invoice"
  documentDescription:
    type: string
    description: Detailed description of the document
    examples:
      - "October Invoice for car insurance"
  invoiceNumber:
    type:
      - string
      - 'null'
    description: Invoice number of the document
    examples:
      - "INV-12345"
  accountId:
    type: integer
    format: int64
    description: >
      Unique identifier for the account associated with the document.
      For Transfer documents, this is the source account.
    examples:
      - 67890
  counterpartyId:
    type:
      - integer
      - 'null'
    format: int64
    description: Counterparty identifier. Applicable to regular documents. Must be omitted or null for Transfer documents.
    examples:
      - 54321
  payment:
    $ref: ../common/payment.yaml
  version:
    $ref: ../common/version.yaml
  transfer:
    oneOf:
      - $ref: 'transfer_request.yaml'
      - type: 'null'
    description: Transfer-specific data. Applicable only when documentType is 'Transfer'. Must be omitted or null for other document types.
  documentItems:
    type: array
    description: List of document items. Applicable to regular documents. Should be omitted or empty when documentType is 'Transfer'.
    items:
      $ref: document_item_request.yaml