type: object
required: 
  - itemType
  - itemId
  - itemQuantity
  - itemPrice
properties:
  seqId:
    type: number
    description: Sequence number identifying the document item within parent Document
    examples:
      - 1 
      - 2
  itemType:
    type: string
    description: Type of document item
    enum:
      - EXP
      - INC
    examples: 
      - INC
      - EXP  
  itemId:
    type: integer
    format: int64
    description: Unique identifier for the document item
    examples:
      - 98765
  itemName:
    type: string
    description: Name of the document item
    examples:
      - "Product A"
  itemQuantity:
    type: number
    format: double
    description: Quantity of the document item
    examples:
      - 10.5
    minimum: 0.001
  itemPrice:
    type: number
    format: double
    description: Price of the document item
    examples:
      - 99.99
    exclusiveMinimum: 0
  itemDescription:
    type: string
    description: Description for document item
    examples: 
      - More details about this item
  version:
    $ref: ../common/version.yaml      