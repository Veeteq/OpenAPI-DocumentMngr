type: object
required:
  - documentDate
  - documentType
  - documentName
  - account
properties:
  documentId:
    type: integer
    format: int64
    description: Unique identifier for the document
    examples:
      - 12345
    readOnly: true
  documentDate:
    type: string
    format: date
    description: Date of the document
    examples:
      - "2023-10-01"
  documentType:
    type: string
    description: Type of the document
    examples:
      - "Invoice"
    minLength: 3
    maxLength: 25
  documentName:
    type: string
    description: Name of the document
    examples:
      - "October Invoice"
    minLength: 3
    maxLength: 255
  documentComment:
    type: string
    description: Additional info related to the document
    examples:
      - "Details for October Invoice"
  invoiceNumber:
    type:
      - string
      - 'null'
    description: Invoice number of the document
    examples:
      - "INV-12345"
  account:
    $ref: 'account.yaml'
    description: Base Account associated with the document
  documentAmount:
    type: 
      - number
      - 'null'
    format: double
    description: Amount of the document. Not applicable for documents with documentType 'Transfer'
    examples:
      - 1500.75
      - null
  counterparty:
    $ref: 'counterparty.yaml'
    description: Counterparty associated with the document
  paymentMethod:
    type: string
    description: Payment method for the document
    examples:
      - "Credit Card"
  currencyCode:
    type: string
    description: Currency code of the document amount
    examples:
      - "USD"
  exchangeRate:
    type: number
    format: double
    description: Exchange rate applicable to the document amount
    examples:
      - 1.12
  documentItemsCount:
    type: integer
    format: int32
    description: Number of items in the document
    examples:
      - 5
    minimum: 1
  documentItems:
    type: array
    description: List of items in the document
    items:
      $ref: document_item_response.yaml
  transferDetails:
    $ref: 'transfer_details.yaml'
    description: >
      Transfer-specific persisted information.
      Present when documentType is 'Transfer' and absent for other document types
  createDateTime:
    $ref: ../common/iso_timestamp.yaml
  updateDateTime:
    $ref: ../common/iso_timestamp.yaml
  version:
    $ref: ../common/version.yaml