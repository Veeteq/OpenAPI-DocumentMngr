type: object
properties:
  documentItemId:
    type: integer
    format: int64
    description: ID of the Document Item
    examples:
      - 12
    readOnly: true
  item:
    $ref: item.yaml
    description: Item placed on this document item
  itemQuantity:
    type: number
    format: double
    description: Quantity of the document item
    examples:
      - 11.234
    pattern: "^-?(?:0|[1-9]\\d{0,2}(?:,?]\\d{3})*)(?:\\.\\d+)?$"
  itemPrice:
    type: number
    format: double
    description: Price of the document item
    examples:
      - 100.50
    pattern: "^-?(?:0|[1-9]\\d{0,2}(?:,?]\\d{3})*)(?:\\.\\d+)?$"
  itemComment:
    type: string
    description: Additional details for the document item
    examples:
      - "Other info about Product A"
  version:
    $ref: ../common/version.yaml