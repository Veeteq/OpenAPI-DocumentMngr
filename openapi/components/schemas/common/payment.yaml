type: object
required:
  - paymentMethod
  - currencyCode
  - exchangeRate
properties:
  paymentMethod:
    type: string
    description: Payment method for the document
    examples:
      - "Credit Card"
  currencyCode:
    type: string
    description: Currency code of the financial operation
    examples:
      - "USD"
    default: 'PLN'
    minLength: 3
    maxLength: 3
  exchangeRate:
    type: number
    format: double
    description: Exchange rate applicable to the financial operation
    examples:
      - 1.234567
    exclusiveMinimum: 0.0
    multipleOf: 0.000001