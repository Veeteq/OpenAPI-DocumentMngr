components:
  parameters:
    Transaction-Id:
      name: Transaction-Id
      in: header
      description: "Transaction-Id header parameter."
      required: true
      schema:
        type: string
        format: uuid
    Accept-Language:
      name: Accept-Language
      in: header
      description: "The language you prefer for messages. Supported values are: en-AU, en-CA, en-GB, en-US, pl-PL. Default is pl-PL."
      required: false
      schema:
        type: string
        default: pl-PL
        examples:
          - en-US 
          - pl-PL
