components:
  parameters:
    pageNumber:
      name: pageNumber
      in: query
      required: false
      description: The page number to retrieve (0-based index).
      schema:
        type: integer
        default: 0
        examples:
          - 0
    pageSize:
      name: pageSize
      in: query
      required: false
      description: The number of items to return per page.
      schema:
        type: integer
        default: 25
        examples:
          - 25
    orderBy:
      name: orderBy
      in: query
      required: false
      description: The field to order the items by.
      schema:
        type: string
        default: id
        examples:
          - itemName
    orderDirection:
      name: orderDirection
      in: query
      required: false
      description: The direction to order the items (asc or desc).
      schema:
        type: string
        enum: [asc, desc]
        default: asc
        examples:
          - asc
