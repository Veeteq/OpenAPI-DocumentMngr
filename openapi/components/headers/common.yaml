components:
  headers:
    Transaction-Id:
      description: Transaction identifier
      schema:
        type: string
        format: uuid
        examples:
          - "4c2a4e2e-a2f9-4d0f-b9f8-f6c4b1a0d1f1"
      required: true
    Location:
      description: URI of the created resource
      schema:
        type: string
